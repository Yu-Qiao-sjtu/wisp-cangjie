<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wisp Cangjie logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14172e"/>
      <stop offset="1" stop-color="#2a1745"/>
    </linearGradient>
    <linearGradient id="gFlask" gradientUnits="userSpaceOnUse" x1="170" y1="120" x2="342" y2="448">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="gLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="241" fill="none" stroke="#f5c26b" stroke-opacity="0.85" stroke-width="6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f5c26b" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- 仓颉四目: four-eyed crown of the legendary scribe -->
  <g fill="#fcd34d">
    <circle cx="256" cy="78" r="7.5"/>
    <circle cx="230" cy="104" r="7.5"/>
    <circle cx="282" cy="104" r="7.5"/>
    <circle cx="256" cy="130" r="7.5"/>
  </g>

  <!-- open book: the long-form content to distill -->
  <g stroke="url(#gFlask)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 152 C 230 128, 198 122, 174 130 L 174 190 C 198 182, 230 188, 256 208 Z" fill="#14172e"/>
    <path d="M256 152 C 282 128, 314 122, 338 130 L 338 190 C 314 182, 282 188, 256 208 Z" fill="#14172e"/>
  </g>
  <path d="M196 144 C 212 140, 228 144, 244 156" fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 144 C 300 140, 284 144, 268 156" fill="none" stroke="#c4b5fd" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>

  <!-- the wisp: methodology rising from the book, flowing into the flask -->
  <path d="M256 218 C 236 236, 276 248, 258 264 C 248 273, 250 283, 256 294"
        fill="none" stroke="#f5c26b" stroke-width="7" stroke-linecap="round"/>

  <!-- distillation flask -->
  <g stroke="url(#gFlask)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M248 292 L 248 314"/>
    <path d="M264 292 L 264 314"/>
    <circle cx="256" cy="378" r="70"/>
  </g>

  <!-- distilled skills pooling in the flask -->
  <path d="M188 390 A70 70 0 0 0 324 390 Z" fill="url(#gLiquid)" opacity="0.92"/>
  <g fill="#ccfbf1" opacity="0.85">
    <circle cx="238" cy="408" r="4"/>
    <circle cx="274" cy="400" r="3"/>
    <circle cx="257" cy="420" r="3"/>
  </g>
  <path d="M256 358 l9 20 20 9 -20 9 -9 20 -9 -20 -20 -9 20 -9 Z" fill="#f0fdfa"/>
</svg>
